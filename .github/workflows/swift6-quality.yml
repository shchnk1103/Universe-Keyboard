name: Swift 6 Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift6-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify_change:
    name: classify-change
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
      requires_full: ${{ steps.classify.outputs.requires_full }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          python3 scripts/ci/classify_changes.py \
            --base "$base_sha" \
            --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  lightweight_checks:
    name: lightweight-checks
    needs: classify_change
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run common lightweight checks
        run: >-
          bash scripts/ci/run_lightweight_checks.sh
          '${{ needs.classify_change.outputs.base_sha }}'
          '${{ needs.classify_change.outputs.head_sha }}'

  build_and_test:
    name: build-and-test
    needs: [classify_change, lightweight_checks]
    if: needs.classify_change.outputs.requires_full == 'true'
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare pinned RIME artifacts
        run: bash scripts/ensure_rime_vendor.sh fetch

      - name: Check Swift formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "${BASE_SHA}" ] || [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          changed_files="$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}" "${GITHUB_SHA}" -- \
            "Universe Keyboard" "Keyboard" "Packages" "UniverseKeyboardTests" "KeyboardTests")"
          while IFS= read -r file; do
            [[ "${file}" == *.swift ]] || continue
            xcrun swift-format lint --strict --configuration .swift-format "${file}"
          done <<< "${changed_files}"

      - name: Test KeyboardCore
        run: swift test --package-path Packages/KeyboardCore

      # The checked-in package binaries intentionally target iOS; test them on
      # the same simulator platform used by the host app.
      - name: Test RimeBridge on iOS Simulator
        run: |
          xcodebuild \
            -project "Universe Keyboard.xcodeproj" \
            -scheme "RimeBridgeTests" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=6.0 \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_SUPPRESS_WARNINGS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test

      - name: Test app and keyboard contracts on iOS Simulator
        run: |
          xcodebuild \
            -project "Universe Keyboard.xcodeproj" \
            -scheme "Universe Keyboard" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=6.0 \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_SUPPRESS_WARNINGS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test

      - name: Build Swift 6 app and keyboard extension for debug
        run: |
          xcodebuild \
            -project "Universe Keyboard.xcodeproj" \
            -scheme "Universe Keyboard" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=6.0 \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_SUPPRESS_WARNINGS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Build Swift 6 app and keyboard extension for release
        run: |
          xcodebuild \
            -project "Universe Keyboard.xcodeproj" \
            -scheme "Universe Keyboard" \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=6.0 \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_SUPPRESS_WARNINGS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

  final_quality_gate:
    name: final-quality-gate
    if: always()
    needs: [classify_change, lightweight_checks, build_and_test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require the classified gate results
        env:
          CLASSIFY_RESULT: ${{ needs.classify_change.result }}
          LIGHTWEIGHT_RESULT: ${{ needs.lightweight_checks.result }}
          HEAVY_RESULT: ${{ needs.build_and_test.result }}
          REQUIRES_FULL: ${{ needs.classify_change.outputs.requires_full }}
        run: >-
          bash scripts/ci/verify_final_gate.sh
          "$CLASSIFY_RESULT"
          "$LIGHTWEIGHT_RESULT"
          "$HEAVY_RESULT"
          "$REQUIRES_FULL"
